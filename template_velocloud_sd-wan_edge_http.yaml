        - macro: '{$VELOCLOUD.METRICS.LAG}'
          value: 10m
          description: 'Atraso aplicado ao fim da janela de métricas. A API pode levar até 10 min para consolidar os dados de um bucket.'
        - macro: '{$VELOCLOUD.NODATA.TIMEOUT}'
