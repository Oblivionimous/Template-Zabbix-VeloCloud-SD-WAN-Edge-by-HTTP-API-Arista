  triggers:
    - uuid: e2ac08c1fd46442f8654759f409c763e
      expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.tunnel.count)=0 and last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=1'
      name: 'VeloCloud Edge: [{HOST.NAME}] Edge conectado sem túneis SD-WAN'
      priority: HIGH
      description: 'O Edge está CONNECTED, mas não houve nenhum túnel ativo na janela de coleta. O tráfego overlay (hubs e gateways) está indisponível.'
      dependencies:
        - name: 'VeloCloud Edge: [{HOST.NAME}] Edge está "OFFLINE"'
          expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=0'
      tags:
        - tag: scope
          value: availability
    - uuid: 41520e20b2df4d128b0d000ac946c9d2
      expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.links.total)>=2 and last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.links.stable)<=1 and last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=1'
      name: 'VeloCloud Edge: [{HOST.NAME}] Perda de redundância de links WAN'
      opdata: 'Estáveis: {ITEM.LASTVALUE2} de {ITEM.LASTVALUE1}'
      priority: WARNING
      description: 'O Edge possui 2 ou mais links WAN e no máximo 1 está estável. A unidade opera sem redundância de link.'
      dependencies:
        - name: 'VeloCloud Edge: [{HOST.NAME}] Edge está "OFFLINE"'
          expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=0'
      tags:
        - tag: scope
          value: availability
    - uuid: fd7d557fe1264c2daf93eb3f18d5738a
      expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.service_uptime)>0 and last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.service_uptime)<600 and last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.system_uptime)>=600'
      name: 'VeloCloud Edge: [{HOST.NAME}] Serviço do Edge reiniciado'
      priority: INFO
      description: 'O serviço do Edge reiniciou sem reboot do equipamento.'
      tags:
        - tag: scope
          value: notice
