zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 58f7374ae5e34a5a845b534f8a163e9e
      name: Personalizados
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 6fd1bd7226934f498169202ba4e9a482
      template: 'VeloCloud SD-WAN Edge by HTTP'
      name: 'VeloCloud SD-WAN Edge by HTTP'
      description: |
        Autor: Mauro Paiva
        Template para monitorar VeloCloud (Arista) SD-WAN Edges pela API REST v1 do Orchestrator (/portal/rest).
        Versão revisada a partir do template oficial Zabbix 7.0.
        
        Macros de conexão sem valor no template, para preencher no host: {$VELOCLOUD.URL}, {$VELOCLOUD.TOKEN} (Secret text), {$VELOCLOUD.ENTERPRISE.ID} e {$VELOCLOUD.EDGE.ID}.
        Para usar {$VELOCLOUD.URL}, {$VELOCLOUD.TOKEN} ou {$VELOCLOUD.ENTERPRISE.ID} como macro global, remova a macro do template: uma macro vazia no template tem precedência sobre a global.
        
        Coletas (4 scripts, com retorno de erro tratado em itens próprios):
        - Get edge data: edge/getEdge com recentLinks, a cada {$VELOCLOUD.EDGE.STATE.FREQUENCY}. Estado do Edge e dos links em tempo real.
        - Get edge metrics: getEdgeStatusMetrics e getEdgeLinkMetrics na mesma janela, a cada {$VELOCLOUD.EDGE.FREQUENCY}.
        - Get edge peer data: getEdgeSDWANPeers e opcionalmente getEdgeSDWANPeerPathMetrics.
        - Get edge application data: getEdgeAppMetrics (desativado por padrão).
        
        Itens brutos (component=raw) guardam o JSON retornado pela API e alimentam os itens dependentes. Retenção definida por {$VELOCLOUD.RAW.HISTORY} (1h na homologação, 0 em produção).
        Consulte a política de rate limit do Orchestrator antes de reduzir os intervalos.
      vendor:
        name: 'Mauro Paiva'
        version: 7.0-2
      groups:
        - name: Personalizados
        - name: 'Templates/Network devices'
      items:
        - uuid: 79aa9ebb1ce64944a78a7c8d7603f53b
          name: 'Activation state'
          type: DEPENDENT
          key: velocloud.edge.activation
          delay: '0'
          history: 90d
          description: 'Estado de ativação do Edge.'
          valuemap:
            name: 'Edge activation state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.edge.activationState
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var map = {"PENDING": 0, "ACTIVATED": 1, "UNASSIGNED": 2, "REACTIVATION_PENDING": 3};
                  return map.hasOwnProperty(value) ? map[value] : 10;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: velocloud.edge.get.data
          tags:
            - tag: component
              value: edge
        - uuid: 7b88dfde5ced4e95b19c30ed1023aea8
          name: 'Build number'
          type: DEPENDENT
          key: velocloud.edge.build
          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          description: 'Build do software do Edge.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.edge.buildNumber
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          master_item:
            key: velocloud.edge.get.data
          tags:
            - tag: component
              value: edge
        - uuid: 8a57dfd93a334b8bb606ae3b4f0c5cb7
          name: 'CPU core temperature'
          type: DEPENDENT
          key: velocloud.edge.cpu.core.temp
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: °C
          description: 'Temperatura máxima do núcleo da CPU na janela de coleta.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status.temp.max
              error_handler: DISCARD_VALUE
          master_item:
            key: velocloud.edge.get.metrics
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 683ed77d5d6140f78eaf1a7a3d712734
              expression: 'min(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.cpu.core.temp,{$VELOCLOUD.EDGE.UTIL.PERIOD})>{$VELOCLOUD.EDGE.TEMP.CRIT}'
              name: 'VeloCloud Edge: [{HOST.NAME}] Temperatura da CPU crítica'
              opdata: 'Temperatura: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Temperatura da CPU acima de {$VELOCLOUD.EDGE.TEMP.CRIT} °C. Verifique ventilação e ambiente do rack.'
              dependencies:
                - name: 'VeloCloud Edge: [{HOST.NAME}] Edge está "OFFLINE"'
                  expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: d6ebd6d586ac4b86b5dd05da0e554aaf
              expression: 'min(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.cpu.core.temp,{$VELOCLOUD.EDGE.UTIL.PERIOD})>{$VELOCLOUD.EDGE.TEMP.WARN}'
              name: 'VeloCloud Edge: [{HOST.NAME}] Temperatura da CPU elevada'
              opdata: 'Temperatura: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Temperatura da CPU acima de {$VELOCLOUD.EDGE.TEMP.WARN} °C.'
              dependencies:
                - name: 'VeloCloud Edge: [{HOST.NAME}] Edge está "OFFLINE"'
                  expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=0'
                - name: 'VeloCloud Edge: [{HOST.NAME}] Temperatura da CPU crítica'
                  expression: 'min(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.cpu.core.temp,{$VELOCLOUD.EDGE.UTIL.PERIOD})>{$VELOCLOUD.EDGE.TEMP.CRIT}'
              tags:
                - tag: scope
                  value: availability
        - uuid: 89f694d5b7784af5a5cd853e30a722e5
          name: 'CPU usage in percent'
          type: DEPENDENT
          key: velocloud.edge.cpu.usage
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          description: 'Uso médio de CPU na janela de coleta.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status.cpu.avg
              error_handler: DISCARD_VALUE
          master_item:
            key: velocloud.edge.get.metrics
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: c8a6374d35fd49bf8952873b63570ae2
              expression: 'min(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.cpu.usage,{$VELOCLOUD.EDGE.UTIL.PERIOD})>{$VELOCLOUD.EDGE.CPU.UTIL.WARN}'
              name: 'VeloCloud Edge: [{HOST.NAME}] Alto uso de CPU'
              event_name: 'VeloCloud Edge: [{HOST.NAME}] Alto uso de CPU (acima de {$VELOCLOUD.EDGE.CPU.UTIL.WARN}% por {$VELOCLOUD.EDGE.UTIL.PERIOD})'
              opdata: 'Uso atual de CPU: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Uso médio de CPU acima de {$VELOCLOUD.EDGE.CPU.UTIL.WARN}% durante {$VELOCLOUD.EDGE.UTIL.PERIOD}.'
              dependencies:
                - name: 'VeloCloud Edge: [{HOST.NAME}] Edge está "OFFLINE"'
                  expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=0'
                - name: 'VeloCloud Edge: [{HOST.NAME}] Uso de CPU crítico'
                  expression: 'min(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.cpu.usage,{$VELOCLOUD.EDGE.UTIL.PERIOD})>{$VELOCLOUD.EDGE.CPU.UTIL.CRIT}'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
            - uuid: e5515b960a0c41e19728ab95feccaa5d
              expression: 'min(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.cpu.usage,{$VELOCLOUD.EDGE.UTIL.PERIOD})>{$VELOCLOUD.EDGE.CPU.UTIL.CRIT}'
              name: 'VeloCloud Edge: [{HOST.NAME}] Uso de CPU crítico'
              opdata: 'Uso atual de CPU: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Uso médio de CPU acima de {$VELOCLOUD.EDGE.CPU.UTIL.CRIT}% durante {$VELOCLOUD.EDGE.UTIL.PERIOD}.'
              dependencies:
                - name: 'VeloCloud Edge: [{HOST.NAME}] Edge está "OFFLINE"'
                  expression: 'last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.state)=0'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 1fab1c2adfaf4db197b7a885b9627608
          name: 'CPU usage in percent (max)'
          type: DEPENDENT
          key: velocloud.edge.cpu.usage.max
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          description: 'Pico de uso de CPU na janela de coleta.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status.cpu.max
              error_handler: DISCARD_VALUE
          master_item:
            key: velocloud.edge.get.metrics
          tags:
            - tag: component
              value: cpu
        - uuid: cecb2a3698704c4c89ef12eb3bb39222
          name: Description
          type: DEPENDENT
          key: velocloud.edge.description
          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          description: 'Descrição do Edge no Orchestrator.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.edge.description
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          master_item:
            key: velocloud.edge.get.data
          tags:
            - tag: component
              value: edge
        - uuid: e875793d90e04672b1ac4ffa79c0e40a
          name: 'Flow count'
          type: DEPENDENT
          key: velocloud.edge.flow.count
          delay: '0'
          history: 90d
          value_type: FLOAT
          description: 'Quantidade média de flows ativos na janela de coleta.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status.flows.avg
              error_handler: DISCARD_VALUE
          master_item:
            key: velocloud.edge.get.metrics
          tags:
            - tag: component
              value: system
        - uuid: e159cb72d8c44b4aab356eebc15da589
          name: 'Get edge data'
          type: SCRIPT
          key: velocloud.edge.get.data
          delay: '{$VELOCLOUD.EDGE.STATE.FREQUENCY}'
          history: '{$VELOCLOUD.RAW.HISTORY}'
          value_type: TEXT
          trends: '0'
          params: |
            var VC = {
              p: {},
              init: function (value) {
                var p = JSON.parse(value);
                ['url', 'token', 'enterprise_id', 'edge_id'].forEach(function (f) {
                  if (typeof p[f] === 'undefined' || p[f] === '' || String(p[f]).charAt(0) === '{') {
                    throw 'Parametro obrigatorio nao definido: ' + f + ' (verifique as macros {$VELOCLOUD.*} do host).';
                  }
                });
                p.url = String(p.url).replace(/^https?:\/\//, '').replace(/\/+$/, '');
                p.enterprise_id = Number(p.enterprise_id);
                p.edge_id = Number(p.edge_id);
                VC.p = p;
              },
              call: function (method, body) {
                var req = new HttpRequest(), resp, status;
                if (VC.p.http_proxy && String(VC.p.http_proxy).charAt(0) !== '{') {
                  req.setProxy(VC.p.http_proxy);
                }
                req.addHeader('Content-Type: application/json');
                req.addHeader('Authorization: Token ' + VC.p.token);
                resp = req.post('https://' + VC.p.url + '/portal/rest/' + method, JSON.stringify(body));
                status = req.getStatus();
                Zabbix.log(4, '[ VeloCloud ] ' + method + ' HTTP ' + status);
                if (status !== 200) {
                  throw method + ': HTTP ' + status + ': ' + String(resp).substring(0, 300);
                }
                try {
                  resp = JSON.parse(resp);
                }
                catch (e) {
                  throw method + ': resposta nao e um JSON valido.';
                }
                if (resp !== null && typeof resp === 'object' && !Array.isArray(resp) && resp.error) {
                  throw method + ': ' + (resp.error.message || JSON.stringify(resp.error));
                }
                return resp;
              },
              sec: function (str, def) {
                var m = String(str).match(/^(\d+)([smhdw]?)$/), mult = {s: 1, m: 60, h: 3600, d: 86400, w: 604800};
                return m ? parseInt(m[1], 10) * mult[m[2] || 's'] : def;
              },
              ts: function (d) {
                if (d === null || typeof d === 'undefined' || d === '' || String(d).indexOf('0000-00-00') === 0) {
                  return null;
                }
                var s = String(d);
                if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(s)) {
                  s = s.replace(' ', 'T');
                }
                if (/T\d{2}:\d{2}:\d{2}(\.\d+)?$/.test(s)) {
                  s += 'Z';
                }
                var t = new Date(s).getTime();
                return isNaN(t) ? null : Math.floor(t / 1000);
              },
              age: function (d) {
                var t = VC.ts(d);
                return t === null ? null : Math.max(0, Math.floor(Date.now() / 1000) - t);
              },
              num: function (v) {
                v = Number(v);
                return isFinite(v) ? v : null;
              },
              round: function (v, n) {
                if (v === null) {
                  return null;
                }
                var f = Math.pow(10, n || 2);
                return Math.round(v * f) / f;
              },
              window: function (freq_default) {
                var win = Math.max(VC.sec(VC.p.window, freq_default), 900),
                  lag = VC.sec(VC.p.lag, 600),
                  end = Math.floor(Date.now() / 1000) - lag,
                  start = end - win;
                return {
                  seconds: win,
                  start: new Date(start * 1000).toISOString(),
                  end: new Date(end * 1000).toISOString()
                };
              },
              out: function (o) {
                return JSON.stringify(o, function (k, v) {
                  return (v === null) ? undefined : v;
                });
              },
              re: function (pattern, def) {
                if (typeof pattern === 'undefined' || pattern === '' || String(pattern).charAt(0) === '{') {
                  pattern = def;
                }
                return new RegExp(pattern);
              }
            };
            
            function linkState(l) {
              return String(l.state || l.linkState || 'UNKNOWN').toUpperCase();
            }
            
            try {
              VC.init(value);
              var e = VC.call('edge/getEdge', {
                enterpriseId: VC.p.enterprise_id,
                id: VC.p.edge_id,
                with: ['recentLinks']
              });
              if (Array.isArray(e)) {
                e = e[0] || {};
              }
            
              var raw = e.recentLinks || e.links || [],
                links = [],
                sum = {total: 0, stable: 0, unstable: 0, disconnected: 0, other: 0};
            
              raw.forEach(function (l) {
                if (l.networkSide && String(l.networkSide).toUpperCase() !== 'WAN') {
                  return;
                }
                var st = linkState(l);
                links.push({
                  id: l.id,
                  logicalId: l.logicalId || '',
                  name: l.displayName || l.name || l.interface || String(l.id),
                  interface: l.interface || '',
                  ip: l.ipAddress || l.linkIpAddress || l.publicIpAddress || '',
                  isp: l.isp || l.org || '',
                  networkType: String(l.networkType || '').toUpperCase(),
                  state: st,
                  vpnState: String(l.vpnState || 'UNKNOWN').toUpperCase(),
                  backupState: String(l.backupState || 'UNCONFIGURED').toUpperCase(),
                  serviceState: String(l.serviceState || 'UNKNOWN').toUpperCase(),
                  lastActiveAge: VC.age(l.lastActive)
                });
                sum.total++;
                if (st === 'STABLE') {
                  sum.stable++;
                }
                else if (st === 'UNSTABLE') {
                  sum.unstable++;
                }
                else if (st === 'DISCONNECTED') {
                  sum.disconnected++;
                }
                else {
                  sum.other++;
                }
              });
            
              return VC.out({
                error: '',
                edge: {
                  id: e.id,
                  name: e.name || '',
                  description: e.description || '',
                  model: e.modelNumber || '',
                  serial: e.serialNumber || '',
                  softwareVersion: e.softwareVersion || '',
                  buildNumber: e.buildNumber || '',
                  platformFirmware: e.platformFirmwareVersion || '',
                  edgeState: String(e.edgeState || 'UNKNOWN').toUpperCase(),
                  activationState: String(e.activationState || 'UNKNOWN').toUpperCase(),
                  serviceState: String(e.serviceState || 'UNKNOWN').toUpperCase(),
                  haState: String(e.haState || 'UNCONFIGURED').toUpperCase(),
                  systemUptime: VC.age(e.systemUpSince),
                  serviceUptime: VC.age(e.serviceUpSince),
                  lastContactAge: VC.age(e.lastContact),
                  isLive: VC.num(e.isLive)
                },
                linksSummary: sum,
                links: links
              });
            }
            catch (error) {
              error = String(error);
              Zabbix.log(3, '[ VeloCloud ] getEdge ERRO: ' + error);
              return JSON.stringify({error: error});
            }
          description: 'Estado do Edge e dos links WAN (edge/getEdge com recentLinks). Dados em tempo real, sem janela de tempo.'
          timeout: '{$VELOCLOUD.EDGE.DATA.TIMEOUT}'
          parameters:
            - name: edge_id
              value: '{$VELOCLOUD.EDGE.ID}'
            - name: enterprise_id
              value: '{$VELOCLOUD.ENTERPRISE.ID}'
            - name: http_proxy
              value: '{$VELOCLOUD.HTTP.PROXY}'
            - name: token
              value: '{$VELOCLOUD.TOKEN}'
            - name: url
              value: '{$VELOCLOUD.URL}'
          tags:
            - tag: component
              value: raw
        - uuid: f0b94440c1db4638b79b48aee74f770f
          name: 'Get edge data collection errors'
          type: DEPENDENT
          key: velocloud.edge.get.data.error
          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          description: 'Mensagem de erro do script de coleta. Vazio quando a coleta foi bem-sucedida.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: velocloud.edge.get.data
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 411e557e080b470f8dfb8267b78a0851
              expression: 'length(last(/VeloCloud SD-WAN Edge by HTTP/velocloud.edge.get.data.error))>0'
              name: 'VeloCloud Edge: [{HOST.NAME}] Falha ao coletar dados de métricas'
              opdata: '{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'O script edge/getEdge retornou erro. Estado do Edge e dos links fica desatualizado. Verifique token, URL, IDs e conectividade do Zabbix server/proxy com o Orchestrator.'
              tags:
                - tag: scope
                  value: notice
        - uuid: 81585d7b998244878798720a7101fa11
          name: 'Get edge application data'
          type: SCRIPT
          key: velocloud.edge.get.flow.data
          delay: '{$VELOCLOUD.APP.FREQUENCY}'
          history: '{$VELOCLOUD.RAW.HISTORY}'
          value_type: TEXT
          trends: '0'
          params: |
            var VC = {
              p: {},
              init: function (value) {
                var p = JSON.parse(value);
                ['url', 'token', 'enterprise_id', 'edge_id'].forEach(function (f) {
                  if (typeof p[f] === 'undefined' || p[f] === '' || String(p[f]).charAt(0) === '{') {
                    throw 'Parametro obrigatorio nao definido: ' + f + ' (verifique as macros {$VELOCLOUD.*} do host).';
                  }
                });
                p.url = String(p.url).replace(/^https?:\/\//, '').replace(/\/+$/, '');
                p.enterprise_id = Number(p.enterprise_id);
                p.edge_id = Number(p.edge_id);
                VC.p = p;
              },
              call: function (method, body) {
                var req = new HttpRequest(), resp, status;
                if (VC.p.http_proxy && String(VC.p.http_proxy).charAt(0) !== '{') {
                  req.setProxy(VC.p.http_proxy);
                }
                req.addHeader('Content-Type: application/json');
                req.addHeader('Authorization: Token ' + VC.p.token);
                resp = req.post('https://' + VC.p.url + '/portal/rest/' + method, JSON.stringify(body));
                status = req.getStatus();
                Zabbix.log(4, '[ VeloCloud ] ' + method + ' HTTP ' + status);
                if (status !== 200) {
                  throw method + ': HTTP ' + status + ': ' + String(resp).substring(0, 300);
                }
                try {
                  resp = JSON.parse(resp);
                }
                catch (e) {
                  throw method + ': resposta nao e um JSON valido.';
                }
                if (resp !== null && typeof resp === 'object' && !Array.isArray(resp) && resp.error) {
                  throw method + ': ' + (resp.error.message || JSON.stringify(resp.error));
                }
                return resp;
              },
              sec: function (str, def) {
                var m = String(str).match(/^(\d+)([smhdw]?)$/), mult = {s: 1, m: 60, h: 3600, d: 86400, w: 604800};
                return m ? parseInt(m[1], 10) * mult[m[2] || 's'] : def;
              },
              ts: function (d) {
                if (d === null || typeof d === 'undefined' || d === '' || String(d).indexOf('0000-00-00') === 0) {
                  return null;
                }
                var s = String(d);
                if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(s)) {
                  s = s.replace(' ', 'T');
                }
                if (/T\d{2}:\d{2}:\d{2}(\.\d+)?$/.test(s)) {
                  s += 'Z';
                }
                var t = new Date(s).getTime();
                return isNaN(t) ? null : Math.floor(t / 1000);
              },
              age: function (d) {
                var t = VC.ts(d);
                return t === null ? null : Math.max(0, Math.floor(Date.now() / 1000) - t);
              },
              num: function (v) {
                v = Number(v);
                return isFinite(v) ? v : null;
              },
              round: function (v, n) {
                if (v === null) {
                  return null;
                }
                var f = Math.pow(10, n || 2);
                return Math.round(v * f) / f;
              },
              window: function (freq_default) {
                var win = Math.max(VC.sec(VC.p.window, freq_default), 900),
                  lag = VC.sec(VC.p.lag, 600),
                  end = Math.floor(Date.now() / 1000) - lag,
                  start = end - win;
                return {
                  seconds: win,
                  start: new Date(start * 1000).toISOString(),
                  end: new Date(end * 1000).toISOString()
                };
              },
              out: function (o) {
                return JSON.stringify(o, function (k, v) {
                  return (v === null) ? undefined : v;
                });
              },
              re: function (pattern, def) {
                if (typeof pattern === 'undefined' || pattern === '' || String(pattern).charAt(0) === '{') {
                  pattern = def;
                }
                return new RegExp(pattern);
              }
            };
            
            try {
              VC.init(value);
              var w = VC.window(3600),
                limit = parseInt(VC.p.top_n, 10) || 10,
                resp = VC.call('metrics/getEdgeAppMetrics', {
                  enterpriseId: VC.p.enterprise_id,
                  edgeId: VC.p.edge_id,
                  interval: {start: w.start, end: w.end},
                  metrics: ['bytesRx', 'bytesTx', 'totalBytes', 'flowCount'],
                  sort: 'totalBytes',
                  limit: limit,
                  resolveApplicationNames: true
                }),
                apps = [],
                total = 0;
            
              if (!Array.isArray(resp)) {
                resp = [];
              }
              resp.forEach(function (a) {
                total += VC.num(a.totalBytes) || 0;
              });
              resp.forEach(function (a) {
