          description: 'Retenção do histórico dos itens brutos (JSON do script e itens Raw data). Use 0 em produção para não gravar JSON no banco. 1h na homologação permite inspecionar o JSON em Dados mais recentes (mínimo aceito pelo Zabbix: 1h).'
        - macro: '{$VELOCLOUD.TOKEN}'
