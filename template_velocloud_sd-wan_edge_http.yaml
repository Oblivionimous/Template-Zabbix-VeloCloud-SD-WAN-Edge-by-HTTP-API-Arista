          description: 'Limite crítico de uso médio de CPU, em %.'
        - macro: '{$VELOCLOUD.EDGE.CPU.UTIL.WARN}'
          value: '80'
          description: 'Limite de alerta de uso médio de CPU, em %.'
        - macro: '{$VELOCLOUD.EDGE.DATA.TIMEOUT}'
          value: 30s
          description: 'Timeout dos scripts de coleta. Aumente se usar métricas por caminho em hubs com muitos peers.'
        - macro: '{$VELOCLOUD.EDGE.FREQUENCY}'
          value: 15m
          description: 'Intervalo e janela das coletas de métricas e peers. A API agrega em buckets de 5 min. Janela mínima efetiva de 15m.'
        - macro: '{$VELOCLOUD.EDGE.HANDOFF.DROPS.WARN}'
          value: '0'
          description: 'Limite de descartes na fila de handoff por janela.'
        - macro: '{$VELOCLOUD.EDGE.ID}'
          description: 'ID do Edge no Orchestrator (definir no host).'
        - macro: '{$VELOCLOUD.EDGE.LASTCONTACT.MAX}'
          value: '900'
          description: 'Idade máxima do último heartbeat do Edge, em segundos.'
        - macro: '{$VELOCLOUD.EDGE.MEMORY.UTIL.CRIT}'
          value: '90'
          description: 'Limite crítico de uso médio de memória, em %.'
        - macro: '{$VELOCLOUD.EDGE.MEMORY.UTIL.WARN}'
          value: '70'
          description: 'Limite de alerta de uso médio de memória, em %.'
        - macro: '{$VELOCLOUD.EDGE.STATE.FREQUENCY}'
          value: 5m
          description: 'Intervalo da coleta de estado do Edge e dos links (getEdge).'
        - macro: '{$VELOCLOUD.EDGE.TEMP.CRIT}'
          value: '85'
          description: 'Limite crítico de temperatura da CPU, em °C.'
        - macro: '{$VELOCLOUD.EDGE.TEMP.WARN}'
          value: '75'
          description: 'Limite de alerta de temperatura da CPU, em °C.'
        - macro: '{$VELOCLOUD.EDGE.UTIL.PERIOD}'
          value: 30m
          description: 'Período avaliado pelos triggers de CPU, memória, temperatura e handoff.'
        - macro: '{$VELOCLOUD.ENTERPRISE.ID}'
          description: 'ID da enterprise no Orchestrator (definir no host).'
        - macro: '{$VELOCLOUD.HTTP.PROXY}'
          description: 'Proxy HTTP opcional para acesso ao Orchestrator, ex. http://proxy:3128.'
        - macro: '{$VELOCLOUD.LINK.FLAP.MAX}'
          value: '4'
          description: 'Máximo de mudanças de estado do link por hora. Aceita contexto pelo nome do link.'
        - macro: '{$VELOCLOUD.LINK.JITTER.WARN}'
          value: '30'
          description: 'Limite de jitter do link, em ms. Aceita contexto pelo nome do link.'
        - macro: '{$VELOCLOUD.LINK.LATENCY.WARN}'
          value: '150'
          description: 'Limite de latência do link, em ms. Aceita contexto pelo nome do link, ex. {$VELOCLOUD.LINK.LATENCY.WARN:"LINK_MPLS_01"}.'
        - macro: '{$VELOCLOUD.LINK.LOSS.WARN}'
          value: '2'
          description: 'Limite de perda de pacotes do link, em %. Aceita contexto pelo nome do link.'
        - macro: '{$VELOCLOUD.LINK.PERIOD}'
          value: 30m
          description: 'Período avaliado pelos triggers de qualidade de link e QoE.'
        - macro: '{$VELOCLOUD.LINK.UTIL.WARN}'
          value: '90'
          description: 'Limite de utilização do link em relação à banda medida, em %. Aceita contexto pelo nome do link.'
        - macro: '{$VELOCLOUD.LLD.APP.NAME.MATCHES}'
          value: '.*'
          description: 'Filtro de aplicações a descobrir.'
        - macro: '{$VELOCLOUD.LLD.APP.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Filtro de aplicações a ignorar.'
        - macro: '{$VELOCLOUD.LLD.LINKS.IF.FILTER.MATCHES}'
          value: '^GE[0-9]+$'
          description: 'Filtro de interfaces dos links WAN a descobrir. Para incluir LTE e SFP use ^(GE|SFP|CELL)[0-9]+$.'
        - macro: '{$VELOCLOUD.LLD.LINKS.NAME.FILTER.MATCHES}'
          value: '.*'
          description: 'Filtro de links a descobrir, pelo nome.'
        - macro: '{$VELOCLOUD.LLD.LINKS.NAME.FILTER.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Filtro de links a ignorar, pelo nome.'
        - macro: '{$VELOCLOUD.LLD.LINKS.WIRELESS.TYPE}'
          value: ^(WIRELESS|LTE|CELLULAR|5G)$
          description: 'networkType dos links que recebem o item Signal strength.'
        - macro: '{$VELOCLOUD.LLD.PEER.NAME.MATCHES}'
