        - uuid: 2c2f2e0a721d473da9dba22933164a42
          name: 'Get edge metrics'
          type: SCRIPT
          key: velocloud.edge.get.metrics
          delay: '{$VELOCLOUD.EDGE.FREQUENCY}'
          history: '{$VELOCLOUD.RAW.HISTORY}'
          value_type: TEXT
          trends: '0'
          params: |
            var VC = {
              p: {},
              init: function (value) {
                var p = JSON.parse(value);
                ['url', 'token', 'enterprise_id', 'edge_id'].forEach(function (f) {
                  if (typeof p[f] === 'undefined' || p[f] === '' || String(p[f]).charAt(0) === '{') {
                    throw 'Parametro obrigatorio nao definido: ' + f + ' (verifique as macros {$VELOCLOUD.*} do host).';
                  }
                });
                p.url = String(p.url).replace(/^https?:\/\//, '').replace(/\/+$/, '');
                p.enterprise_id = Number(p.enterprise_id);
                p.edge_id = Number(p.edge_id);
                VC.p = p;
              },
              call: function (method, body) {
                var req = new HttpRequest(), resp, status;
                if (VC.p.http_proxy && String(VC.p.http_proxy).charAt(0) !== '{') {
                  req.setProxy(VC.p.http_proxy);
                }
                req.addHeader('Content-Type: application/json');
                req.addHeader('Authorization: Token ' + VC.p.token);
                resp = req.post('https://' + VC.p.url + '/portal/rest/' + method, JSON.stringify(body));
                status = req.getStatus();
                Zabbix.log(4, '[ VeloCloud ] ' + method + ' HTTP ' + status);
                if (status !== 200) {
                  throw method + ': HTTP ' + status + ': ' + String(resp).substring(0, 300);
                }
                try {
                  resp = JSON.parse(resp);
                }
                catch (e) {
                  throw method + ': resposta nao e um JSON valido.';
                }
                if (resp !== null && typeof resp === 'object' && !Array.isArray(resp) && resp.error) {
                  throw method + ': ' + (resp.error.message || JSON.stringify(resp.error));
                }
                return resp;
              },
              sec: function (str, def) {
                var m = String(str).match(/^(\d+)([smhdw]?)$/), mult = {s: 1, m: 60, h: 3600, d: 86400, w: 604800};
                return m ? parseInt(m[1], 10) * mult[m[2] || 's'] : def;
              },
              ts: function (d) {
                if (d === null || typeof d === 'undefined' || d === '' || String(d).indexOf('0000-00-00') === 0) {
                  return null;
                }
                var s = String(d);
                if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(s)) {
                  s = s.replace(' ', 'T');
                }
                if (/T\d{2}:\d{2}:\d{2}(\.\d+)?$/.test(s)) {
                  s += 'Z';
                }
                var t = new Date(s).getTime();
                return isNaN(t) ? null : Math.floor(t / 1000);
              },
              age: function (d) {
                var t = VC.ts(d);
                return t === null ? null : Math.max(0, Math.floor(Date.now() / 1000) - t);
              },
              num: function (v) {
                v = Number(v);
                return isFinite(v) ? v : null;
              },
              round: function (v, n) {
                if (v === null) {
                  return null;
                }
                var f = Math.pow(10, n || 2);
                return Math.round(v * f) / f;
              },
              window: function (freq_default) {
                var win = Math.max(VC.sec(VC.p.window, freq_default), 900),
                  lag = VC.sec(VC.p.lag, 600),
                  end = Math.floor(Date.now() / 1000) - lag,
                  start = end - win;
                return {
                  seconds: win,
                  start: new Date(start * 1000).toISOString(),
                  end: new Date(end * 1000).toISOString()
                };
              },
              out: function (o) {
                return JSON.stringify(o, function (k, v) {
                  return (v === null) ? undefined : v;
                });
              },
              re: function (pattern, def) {
                if (typeof pattern === 'undefined' || pattern === '' || String(pattern).charAt(0) === '{') {
                  pattern = def;
                }
                return new RegExp(pattern);
              }
            };
            
            function rate(bytes, sec) {
              var b = VC.num(bytes);
              return b === null ? 0 : Math.round(b * 8 / sec);
            }
            
            try {
              VC.init(value);
              var w = VC.window(900),
                interval = {start: w.start, end: w.end},
                st = VC.call('metrics/getEdgeStatusMetrics', {
                  enterpriseId: VC.p.enterprise_id,
                  edgeId: VC.p.edge_id,
                  interval: interval,
                  metrics: ['tunnelCount', 'tunnelCountV6', 'memoryPct', 'flowCount', 'cpuPct', 'cpuCoreTemp', 'handoffQueueDrops']
                }),
                lm = VC.call('metrics/getEdgeLinkMetrics', {
                  enterpriseId: VC.p.enterprise_id,
                  edgeId: VC.p.edge_id,
                  interval: interval
                }),
                links = {},
                tot = {rx: 0, tx: 0, p1Rx: 0, p1Tx: 0, p2Rx: 0, p2Tx: 0, p3Rx: 0, p3Tx: 0, ctrlRx: 0, ctrlTx: 0};
            
              function s(name) {
                var o = st && st[name] ? st[name] : {};
                return {min: VC.num(o.min), max: VC.num(o.max), avg: VC.round(VC.num(o.average), 2)};
              }
            
              if (!Array.isArray(lm)) {
                lm = [];
              }
            
              lm.forEach(function (m) {
                var id = String(m.linkId || (m.link && m.link.id) || ''),
                  sec = w.seconds,
                  o;
                if (id === '') {
                  return;
                }
                o = {
                  throughputRx: rate(m.bytesRx, sec),
                  throughputTx: rate(m.bytesTx, sec),
                  bandwidthRx: VC.num(m.bpsOfBestPathRx),
                  bandwidthTx: VC.num(m.bpsOfBestPathTx),
                  latencyRx: VC.num(m.bestLatencyMsRx),
                  latencyTx: VC.num(m.bestLatencyMsTx),
                  jitterRx: VC.num(m.bestJitterMsRx),
                  jitterTx: VC.num(m.bestJitterMsTx),
                  lossRx: VC.num(m.bestLossPctRx),
                  lossTx: VC.num(m.bestLossPctTx),
                  signalStrength: VC.num(m.signalStrength),
                  p1Rx: rate(m.p1BytesRx, sec), p1Tx: rate(m.p1BytesTx, sec),
                  p2Rx: rate(m.p2BytesRx, sec), p2Tx: rate(m.p2BytesTx, sec),
                  p3Rx: rate(m.p3BytesRx, sec), p3Tx: rate(m.p3BytesTx, sec),
                  ctrlRx: rate(m.controlBytesRx, sec), ctrlTx: rate(m.controlBytesTx, sec)
                };
                o.utilRx = (o.bandwidthRx > 0) ? VC.round(Math.min(o.throughputRx / o.bandwidthRx * 100, 100), 2) : null;
                o.utilTx = (o.bandwidthTx > 0) ? VC.round(Math.min(o.throughputTx / o.bandwidthTx * 100, 100), 2) : null;
                links[id] = o;
            
                tot.rx += o.throughputRx; tot.tx += o.throughputTx;
                tot.p1Rx += o.p1Rx; tot.p1Tx += o.p1Tx;
                tot.p2Rx += o.p2Rx; tot.p2Tx += o.p2Tx;
                tot.p3Rx += o.p3Rx; tot.p3Tx += o.p3Tx;
                tot.ctrlRx += o.ctrlRx; tot.ctrlTx += o.ctrlTx;
              });
            
              return VC.out({
                error: '',
                window: {seconds: w.seconds, start: w.start, end: w.end},
                status: {
                  cpu: s('cpuPct'),
                  memory: s('memoryPct'),
                  temp: s('cpuCoreTemp'),
                  flows: s('flowCount'),
                  tunnels: s('tunnelCount'),
                  tunnelsV6: s('tunnelCountV6'),
                  handoffDrops: s('handoffQueueDrops')
                },
                total: tot,
                linkCount: lm.length,
                links: links
              });
            }
            catch (error) {
              error = String(error);
              Zabbix.log(3, '[ VeloCloud ] metrics ERRO: ' + error);
              return JSON.stringify({error: error});
            }
          description: 'Saude do Edge (metrics/getEdgeStatusMetrics) e metricas por link (metrics/getEdgeLinkMetrics) na mesma janela de tempo. A janela termina em now-{$VELOCLOUD.METRICS.LAG} para evitar buckets incompletos (a API pode levar ate 10 min para consolidar os dados).'
          timeout: '{$VELOCLOUD.EDGE.DATA.TIMEOUT}'
          parameters:
            - name: edge_id
              value: '{$VELOCLOUD.EDGE.ID}'
            - name: enterprise_id
              value: '{$VELOCLOUD.ENTERPRISE.ID}'
            - name: http_proxy
              value: '{$VELOCLOUD.HTTP.PROXY}'
            - name: lag
              value: '{$VELOCLOUD.METRICS.LAG}'
            - name: token
              value: '{$VELOCLOUD.TOKEN}'
            - name: url
              value: '{$VELOCLOUD.URL}'
            - name: window
              value: '{$VELOCLOUD.EDGE.FREQUENCY}'
          tags:
            - tag: component
              value: raw
        - uuid: d65822f5a55c4c88b103367595d96846
