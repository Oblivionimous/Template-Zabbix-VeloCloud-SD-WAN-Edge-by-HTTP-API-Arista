              init: function (value) {
                var p = JSON.parse(value);
                ['url', 'token', 'enterprise_id', 'edge_id'].forEach(function (f) {
                  if (typeof p[f] === 'undefined' || p[f] === '' || String(p[f]).charAt(0) === '{') {
